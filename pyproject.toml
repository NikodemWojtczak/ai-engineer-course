[project]
name = "ai-engineer-course"
version = "0.1.0"
description = "Hands-on course notebooks for the AI Engineer Skill Roadmap"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agno==3.1.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.6",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
