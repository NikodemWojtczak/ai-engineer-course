requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk>=0.3,<1",
    "agentevals>=0.0.9",
    "agno==3.1.1",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.6",
    "langchain>=1.4.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "openai>=3.24.0",
    "openevals>=0.2.0",
    "openinference-instrumentation-agno>=1.0.14",
    "openinference-instrumentation-langchain>=0.1.78",
    "opentelemetry-sdk>=1.45.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
