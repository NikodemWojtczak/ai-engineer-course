<rect x="560" y="60" width="196" height="162" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="570" y="74.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">one run passes with p = 0.75</text>
<text x="570" y="89.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve"></text>
<text x="570" y="104.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">pass@k = 1 − (1 − p)^k</text>
<text x="570" y="119.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">at least one of k runs</text>
<text x="570" y="134.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">passes: a person picks</text>
<text x="570" y="149.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the best of k tries</text>
<text x="570" y="164.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve"></text>
<text x="570" y="179.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">pass^k = p^k</text>
<text x="570" y="194.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">all k runs pass: the</text>
<text x="570" y="209.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">same customer, k times</text>
<text x="24" y="344" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The same agent, two questions. If a person retries until it works, it gets better with k; if every run must work, it gets worse.</text>
