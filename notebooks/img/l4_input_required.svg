<rect x="24" y="400" width="732" height="27" rx="6" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="34" y="414.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Asking back needs a task: a message has no state. A client that looks only for a message's parts cannot read either reply.</text>
