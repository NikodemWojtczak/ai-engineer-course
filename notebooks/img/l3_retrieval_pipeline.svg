<svg xmlns="http://www.w3.org/2000/svg" width="780" height="404" viewBox="0 0 780 404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="404" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Retrieval: from documents to the passages in the prompt</text>
<text x="24" y="56" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">once, before any question</text>
<rect x="24" y="70" width="110" height="56" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="79.0" y="90.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">HANDBOOK +</text>
<text x="79.0" y="107.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">POLICIES</text>
<rect x="158" y="70" width="140" height="56" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="228.0" y="82.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">make_chunks</text>
<text x="228.0" y="99.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">92 chunks, one per</text>
<text x="228.0" y="114.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">paragraph</text>
<rect x="322" y="70" width="140" height="56" rx="6" fill="#ece6f8" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="392.0" y="82.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">embed</text>
<text x="392.0" y="99.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">CHUNK_VECTORS:</text>
<text x="392.0" y="114.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">92 × 256 numbers</text>
<rect x="486" y="70" width="130" height="56" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="551.0" y="82.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">count words</text>
<text x="551.0" y="99.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">CHUNK_WORDS,</text>
<text x="551.0" y="114.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">CHUNKS_WITH</text>
<line x1="134" y1="98" x2="156" y2="98" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="298" y1="98" x2="320" y2="98" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 228 126 L 228 142 L 551 142 L 551 128" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="24" y="178" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">for every question</text>
<rect x="24" y="214" width="110" height="52" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="79.0" y="224.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">question</text>
<text x="79.0" y="241.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">"cash machine</text>
<text x="79.0" y="256.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">per day, Youth?"</text>
<rect x="166" y="192" width="128" height="40" rx="6" fill="#ece6f8" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="230.0" y="212.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">vector_ranking</text>
<rect x="166" y="248" width="128" height="40" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="230.0" y="268.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">bm25_ranking</text>
<line x1="134" y1="232" x2="164" y2="214" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="134" y1="248" x2="164" y2="266" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="322" y="214" width="104" height="52" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="374.0" y="224.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">rrf</text>
<text x="374.0" y="241.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">hybrid: one</text>
<text x="374.0" y="256.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">ranking</text>
<line x1="294" y1="212" x2="320" y2="232" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="294" y1="268" x2="320" y2="250" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="454" y="214" width="104" height="52" rx="6" fill="#ece6f8" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="506.0" y="224.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">rerank</text>
<text x="506.0" y="241.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a model orders</text>
<text x="506.0" y="256.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the top 10</text>
<line x1="426" y1="240" x2="452" y2="240" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="586" y="214" width="170" height="52" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="671.0" y="224.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the prompt</text>
<text x="671.0" y="241.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the top 3 passages</text>
<text x="671.0" y="256.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">go to the model</text>
<line x1="558" y1="240" x2="584" y2="240" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24" y="300" width="510" height="42" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="34" y="314.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">recall@3 measures the search alone: is the gold chunk among the first three results?</text>
<text x="34" y="329.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">No chat call is needed to measure it; a miss means the model never sees the answer.</text>
<text x="24" y="384" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Embeddings and word counts are made once. Each question costs one embedding call, the ranking and the reranker's call.</text>
</svg>
