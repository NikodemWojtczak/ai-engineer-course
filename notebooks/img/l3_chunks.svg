<text x="34" y="300.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The title goes in front of the text: "The interest rate is 0.5%" alone does not say which product it is about.</text>
