<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="440" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">The agent loop of this level: policy and reviewer sit inside apply_tool</text>
<rect x="24" y="52" width="220" height="54" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="134.0" y="71.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">model_fn(messages, schemas)</text>
<text x="134.0" y="88.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the next assistant message</text>
<line x1="134" y1="106" x2="134" y2="138" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24" y="138" width="220" height="46" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="134.0" y="161.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">tool_calls in the message?</text>
<line x1="134" y1="184" x2="134" y2="220" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="146" y="202" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">no</text>
<rect x="24" y="220" width="220" height="74" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="134.0" y="241.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">return the result</text>
<text x="134.0" y="258.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">answer · messages</text>
<text x="134.0" y="273.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">tool_calls · world_diff</text>
<line x1="244" y1="161" x2="300" y2="161" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="262" y="151" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">yes</text>
<rect x="300" y="132" width="190" height="58" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="395.0" y="153.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">apply_tool: policy</text>
<text x="395.0" y="170.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">policy(name, args, context)</text>
<path d="M 490 161 C 515 161, 515 90, 540 90" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="540" y="64" width="216" height="52" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="648.0" y="82.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">None: allowed</text>
<text x="648.0" y="99.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">run TOOLS[name](**args)</text>
<path d="M 490 161 C 515 161, 515 176, 540 176" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="540" y="150" width="216" height="52" rx="6" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="648.0" y="168.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">"ask": a human decides</text>
<text x="648.0" y="185.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">reviewer(name, args) → yes / no</text>
<path d="M 490 161 C 515 161, 515 262, 540 262" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="540" y="236" width="216" height="52" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="648.0" y="254.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">a reason: denied</text>
<text x="648.0" y="271.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"Denied by policy: &lt;reason&gt;"</text>
<rect x="300" y="318" width="456" height="46" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="528.0" y="341.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">each outcome goes back as a tool message, with the call's id</text>
<path d="M 648 288 L 648 316" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 300 341 L 284 341 L 284 79 L 246 79" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="24" y="384" width="732" height="42" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="34" y="398.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">A denial is not an error: it comes back as an ordinary tool result, so the model reads it and can explain it to the user.</text>
<text x="34" y="413.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">A rejected approval comes back the same way: "Denied by policy: this action was not approved". Every model call, tool call and approval is a span.</text>
</svg>
