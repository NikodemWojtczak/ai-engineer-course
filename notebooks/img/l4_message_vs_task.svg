<text x="48" y="200.5" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"messageId": "…",</text>
<text x="48" y="215.5" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"role": "agent",</text>
<text x="48" y="230.5" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"parts": [{"kind": "text",</text>
<text x="48" y="245.5" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">           "text": "&lt;the answer&gt;"}]</text>
<text x="40" y="268" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the text: parts[0].text</text>
<text x="40" y="286" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">our server, the SDK server</text>
<rect x="424" y="120" width="332" height="186" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="440" y="140" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">result.kind = "task"</text>
<text x="440" y="158" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">work with an id, a state and a history</text>
