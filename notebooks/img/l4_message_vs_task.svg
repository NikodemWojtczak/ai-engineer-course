<text x="34" y="480.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Both shapes are valid A2A, and a server may pick either: a client must read both, and a task's state before its text.</text>
