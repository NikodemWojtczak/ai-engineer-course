<rect x="238" y="430" width="98.63" height="20" rx="10" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="287.315" y="440.5" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">auth-required</text>
<path d="M 180 372 C 180 430, 220 440, 236 440" fill="none" stroke="#52514e" stroke-width="1.4"/>
<text x="370" y="410" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">waits for the client, then goes on working</text>
