<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker></defs>
<rect width="760" height="228" fill="#fcfcfb"/>
<rect x="30" y="60" width="180" height="56" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="120.0" y="80.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">the text so far</text>
<text x="120.0" y="97.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">prompt + tokens already written</text>
<line x1="210" y1="88" x2="255" y2="88" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="255" y="60" width="110" height="56" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="310.0" y="80.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">the model</text>
<text x="310.0" y="97.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">one forward pass</text>
<line x1="365" y1="88" x2="410" y2="88" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="410" y="38" width="170" height="100" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="495" y="52" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">probabilities for the next token</text>
<text x="452" y="72" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle">' the'</text>
<rect x="458" y="66" width="62" height="11" fill="#2a78d6" rx="2"/>
<text x="524" y="72" font-size="9" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle">62%</text>
<text x="452" y="89" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle">' a'</text>
<rect x="458" y="83" width="21" height="11" fill="#2a78d6" rx="2"/>
<text x="483" y="89" font-size="9" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle">21%</text>
<text x="452" y="106" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle">' your'</text>
<rect x="458" y="100" width="9" height="11" fill="#2a78d6" rx="2"/>
<text x="471" y="106" font-size="9" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle">9%</text>
<text x="452" y="123" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle">' our'</text>
<rect x="458" y="117" width="5" height="11" fill="#2a78d6" rx="2"/>
<text x="467" y="123" font-size="9" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle">5%</text>
<line x1="580" y1="88" x2="625" y2="88" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="625" y="60" width="110" height="56" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="680.0" y="80.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">pick one</text>
<text x="680.0" y="97.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">sampling</text>
<path d="M 680 116 L 680 160 L 120 160 L 120 118" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="400" y="174" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">append the token to the text, and run the same step again</text>
<text x="400" y="194" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">stop when the model picks the end token, or when the output limit is reached</text>
<text x="400" y="212" font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">an answer of 200 tokens is 200 of these steps</text>
</svg>
