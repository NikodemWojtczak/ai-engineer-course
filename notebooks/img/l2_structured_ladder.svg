<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="430" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">From free text to a typed object</text>
<rect x="24" y="230" width="176" height="150" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="34" y="248" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">free text</text>
<text x="34" y="272" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you send</text>
<text x="34" y="286" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">a prompt</text>
<text x="34" y="306" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you get</text>
<text x="34" y="320" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">prose</text>
<text x="34" y="340" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">guaranteed</text>
<text x="34" y="354" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">nothing</text>
<rect x="208" y="190" width="176" height="190" rx="6" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="218" y="208" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">JSON mode</text>
<text x="218" y="232" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you send</text>
<text x="218" y="246" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">response_format: {"type":</text>
<text x="218" y="260" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"json_object"}</text>
<text x="218" y="280" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you get</text>
<text x="218" y="294" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">valid JSON</text>
<text x="218" y="314" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">guaranteed</text>
<text x="218" y="328" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the syntax; keys and values</text>
<text x="218" y="342" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">are the model's choice</text>
<rect x="392" y="150" width="176" height="230" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="402" y="168" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">strict JSON schema</text>
<text x="402" y="192" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you send</text>
<text x="402" y="206" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">response_format: {"type":</text>
<text x="402" y="220" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"json_schema", …,</text>
<text x="402" y="234" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"strict": true}</text>
<text x="402" y="254" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you get</text>
<text x="402" y="268" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">JSON in your shape</text>
<text x="402" y="288" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">guaranteed</text>
<text x="402" y="302" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">keys, types, enums, no</text>
<text x="402" y="316" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">extra keys</text>
<rect x="576" y="110" width="176" height="270" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="586" y="128" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Pydantic + parse</text>
<text x="586" y="152" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you send</text>
<text x="586" y="166" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">response_format=Ticket</text>
<text x="586" y="186" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">you get</text>
<text x="586" y="200" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a Ticket object</text>
<text x="586" y="220" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">guaranteed</text>
<text x="586" y="234" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the strict schema, plus a</text>
<text x="586" y="248" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">typed object; check refusal</text>
<line x1="40" y1="398" x2="740" y2="398" stroke="#898781" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="390" y="414" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">more is guaranteed about the shape; nothing about the content (valid is not correct)</text>
</svg>
