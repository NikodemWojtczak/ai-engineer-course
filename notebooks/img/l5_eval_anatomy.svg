<line x1="452" y1="254" x2="486" y2="254" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24" y="334" width="732" height="58" rx="6" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="36" y="352" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the report: one row per kind</text>
<text x="36" y="374" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">classify 14/14 = 100 % · rag 6/6 · abstain 2/2 · cost per task · seconds per task · evalset-v1</text>
<text x="24" y="414" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">An eval is a function from (input, output, reference) to a score with a comment. Run it over the task set, keep every row,</text>
<text x="24" y="430" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">and report the pass rate with its n, its cost and the version of the set.</text>
