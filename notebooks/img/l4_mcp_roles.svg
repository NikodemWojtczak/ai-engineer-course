<svg xmlns="http://www.w3.org/2000/svg" width="780" height="336" viewBox="0 0 780 336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="336" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">MCP: host, client, server</text>
<rect x="24" y="44" width="330" height="250" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="40" y="64" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">host: our support agent</text>
<rect x="44" y="82" width="290" height="42" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="189.0" y="95.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the model</text>
<text x="189.0" y="112.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">decides which tool to call, and when</text>
<rect x="44" y="140" width="290" height="42" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/>
<text x="189.0" y="153.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">our loop (run_agent)</text>
<text x="189.0" y="170.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">runs the model's tool calls</text>
<rect x="44" y="198" width="290" height="54" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/>
<text x="189.0" y="209.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">MCP client</text>
<text x="189.0" y="226.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">one connection to one server</text>
<text x="189.0" y="241.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">mcp_post · MCPAdapter · MCPTools</text>
<text x="189" y="274" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a host may hold several clients, one per server</text>
<line x1="189" y1="124" x2="189" y2="140" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="189" y1="182" x2="189" y2="198" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="462" y="44" width="294" height="250" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="478" y="64" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">MCP server: NovaBank, FastMCP</text>
<text x="478" y="82" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">describes things and runs them; no model</text>
<rect x="478" y="98" width="262" height="54" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
<text x="490" y="114" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">tools</text>
<text x="570" y="114" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">get_balance, refund, …</text>
<text x="490" y="136" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">picked by the model</text>
<rect x="478" y="162" width="262" height="54" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
<text x="490" y="178" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">resources</text>
<text x="570" y="178" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">novabank://handbook</text>
<text x="490" y="200" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">picked by the application</text>
<rect x="478" y="226" width="262" height="54" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
<text x="490" y="242" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">prompts</text>
<text x="570" y="242" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">complaint_reply</text>
<text x="490" y="264" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">picked by the user</text>
<line x1="334" y1="216" x2="462" y2="216" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="462" y1="236" x2="334" y2="236" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="398" y="196" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">JSON-RPC</text>
<text x="398" y="254" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Streamable HTTP</text>
<text x="398" y="268" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">or stdio</text>
<text x="24" y="316" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The model never talks to the server. It reads what the client turned into tool definitions; the loop sends the calls.</text>
</svg>
