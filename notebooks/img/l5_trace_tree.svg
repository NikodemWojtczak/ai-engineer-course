<rect x="58" y="208" width="266" height="40" rx="6" fill="#ece6f8" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="68" y="221" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">chat small</text>
<text x="68" y="237" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a model call: answers in text</text>
<line x1="40" y1="92" x2="40" y2="228" stroke="#898781" stroke-width="1.1"/>
<text x="40" y="274" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">all four spans: trace_id 4bf92f35…; each its own span_id and its parent's id</text>
<line x1="326" y1="98" x2="470" y2="98" stroke="#7b5cc4" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="326" y1="202" x2="470" y2="202" stroke="#7b5cc4" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="398" y="86" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">HTTP header</text>
<text x="398" y="114" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">traceparent</text>
<rect x="472" y="52" width="284" height="196" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
