<rect width="780" height="372" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">A trace: a tree of spans, and one id from the agent to the bill</text>
