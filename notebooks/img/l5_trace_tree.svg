<text x="484" y="152" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">cost</text>
<text x="560" y="152" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">0.00021</text>
<text x="484" y="170" font-size="10" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">trace_id</text>
<text x="560" y="170" font-size="10" fill="#7b5cc4" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"4bf92f35…"</text>
<text x="484" y="196" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a hook reads the header and</text>
<text x="484" y="212" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">writes its trace id into the entry</text>
<rect x="24" y="296" width="732" height="42" rx="6" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="34" y="310.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</text>
<text x="34" y="325.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">             version  trace id (32 hex)               parent span id    flags</text>
<text x="24" y="352" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The trace id joins the two records: what the agent did (the spans) and what each call cost (the gateway log).</text>
