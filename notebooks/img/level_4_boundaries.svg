<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker></defs>
<rect width="760" height="300" fill="#fcfcfb"/>
<!-- the model, behind the gateway -->
<rect x="290" y="16" width="180" height="48" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="380" y="33" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">the model</text>
<text x="380" y="50" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">every call goes through the gateway</text>
<line x1="380" y1="66" x2="380" y2="113" stroke="#52514e" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="388" y="90" font-size="9.5" fill="#52514e" dominant-baseline="middle">team support</text>
<!-- the support agent in the middle -->
<rect x="290" y="115" width="180" height="60" rx="8" fill="#efeeea" stroke="#52514e" stroke-width="1.4"/>
<text x="380" y="137" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">support agent</text>
<text x="380" y="156" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">the loop from Part 0</text>
<!-- MCP on the left -->
<rect x="30" y="115" width="170" height="60" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="115" y="137" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">MCP server</text>
<text x="115" y="156" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">get_balance, refund, …</text>
<line x1="202" y1="145" x2="288" y2="145" stroke="#52514e" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="245" y="131" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">MCP</text>
<text x="245" y="160" font-size="9" fill="#52514e" text-anchor="middle" dominant-baseline="middle">tools/list</text>
<text x="245" y="172" font-size="9" fill="#52514e" text-anchor="middle" dominant-baseline="middle">tools/call</text>
<!-- A2A on the right -->
<rect x="560" y="115" width="170" height="60" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="645" y="137" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">lending agent</text>
<text x="645" y="156" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">another team, its own model</text>
<line x1="472" y1="145" x2="558" y2="145" stroke="#52514e" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="515" y="131" font-size="11" fill="#eb6834" text-anchor="middle" font-weight="bold" dominant-baseline="middle">A2A</text>
<text x="515" y="160" font-size="9" fill="#52514e" text-anchor="middle" dominant-baseline="middle">agent card</text>
<text x="515" y="172" font-size="9" fill="#52514e" text-anchor="middle" dominant-baseline="middle">message/send</text>
<path d="M 645 113 L 645 40 L 472 40" fill="none" stroke="#52514e" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="653" y="90" font-size="9.5" fill="#52514e" dominant-baseline="middle">team lending</text>
<!-- Skills below -->
<rect x="290" y="232" width="180" height="52" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="380" y="250" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">skills folder</text>
<text x="380" y="268" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">SKILL.md: name, description, steps</text>
<line x1="380" y1="230" x2="380" y2="177" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="390" y="197" font-size="11" fill="#1baf7a" font-weight="bold" dominant-baseline="middle">Skills</text>
<text x="390" y="213" font-size="9" fill="#52514e" dominant-baseline="middle">catalog always, steps when needed</text>
<!-- what each boundary means -->
<text x="30" y="200" font-size="9.5" fill="#52514e" dominant-baseline="middle">the server runs the function;</text>
<text x="30" y="214" font-size="9.5" fill="#52514e" dominant-baseline="middle">our model decides when</text>
<text x="730" y="200" font-size="9.5" fill="#52514e" text-anchor="end" dominant-baseline="middle">the other agent thinks</text>
<text x="730" y="214" font-size="9.5" fill="#52514e" text-anchor="end" dominant-baseline="middle">and pays for its own calls</text>
</svg>
