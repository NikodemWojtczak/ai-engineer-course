<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker></defs>
<rect width="760" height="262" fill="#fcfcfb"/>
<rect x="20" y="40" width="180" height="56" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="110" y="60" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">messages</text>
<text x="110" y="78" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">system · user · tool calls · results</text>
<rect x="270" y="40" width="200" height="56" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="370" y="60" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">the model</text>
<text x="370" y="78" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">reads the list and the tool schemas</text>
<rect x="540" y="40" width="200" height="56" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="640" y="60" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">tool calls in the reply?</text>
<text x="640" y="78" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">the only question your loop asks</text>
<rect x="540" y="176" width="200" height="56" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="640" y="196" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">no: the text is the answer</text>
<text x="640" y="214" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">the loop ends</text>
<rect x="270" y="176" width="200" height="56" rx="6" fill="#fdeee7" stroke="#eb6834" stroke-width="1.2"/>
<text x="370" y="196" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle">yes: your code runs each tool</text>
<text x="370" y="214" font-size="9.5" fill="#52514e" text-anchor="middle" dominant-baseline="middle">one tool message per call</text>
<path d="M 200 68 L 266 68" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M 470 68 L 536 68" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M 640 96 L 640 172" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M 600 96 L 600 136 L 420 136 L 420 172" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M 270 204 L 110 204 L 110 100" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<text x="118" y="178" font-size="9.5" fill="#52514e">append the call</text>
<text x="118" y="192" font-size="9.5" fill="#52514e">and the results, repeat</text>
<text x="20" y="22" font-size="12" fill="#0b0b0b" font-weight="bold">The agent loop</text>
<text x="20" y="252" font-size="9.5" fill="#52514e">The model decides how many rounds. Your code decides the maximum: max_steps.</text>
</svg>
