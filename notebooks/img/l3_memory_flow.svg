<rect x="324" y="154" width="176" height="28" rx="0" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="331" y="168" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">New card to the Lisbon address</text>
