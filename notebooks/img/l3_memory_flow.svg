<rect x="24" y="206" width="210" height="52" rx="6" fill="#ece6f8" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="129.0" y="216.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">extract_facts</text>
<text x="129.0" y="233.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">one model call: the facts</text>
<text x="129.0" y="248.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">worth keeping, one per line</text>
<line x1="129" y1="258" x2="129" y2="282" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24" y="284" width="210" height="44" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="129.0" y="298.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">remember(user, fact, source)</text>
<text x="129.0" y="315.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">source = "customer_said"</text>
<text x="427.0" y="58" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the memories table (sqlite)</text>
