<rect x="616" y="230" width="148" height="60" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="690.0" y="244.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Tuesday · a new chat</text>
<text x="690.0" y="261.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">no history at all; the</text>
<text x="690.0" y="276.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">facts sit in the system prompt</text>
<rect x="262" y="236" width="330" height="57" rx="6" fill="#fdf1d6" stroke="#eda100" stroke-width="1.2"/>
<text x="272" y="250.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The model remembers nothing between the two chats.</text>
<text x="272" y="265.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Your code wrote the row on Monday and read it</text>
<text x="272" y="280.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">into Tuesday's system prompt.</text>
<rect x="262" y="312" width="330" height="42" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="272" y="326.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">A stored fact is read as true in every later session.</text>
<text x="272" y="341.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The source column says how far to trust it.</text>
<text x="24" y="384" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Long-term memory: a row your code writes after one session and reads at the start of the next.</text>
