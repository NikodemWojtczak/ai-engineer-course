<text x="129.0" y="134.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Monday · a chat</text>
<text x="129.0" y="151.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">"I moved from Warsaw to Lisbon.</text>
<text x="129.0" y="166.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Send my card there."</text>
