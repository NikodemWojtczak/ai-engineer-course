<text x="507" y="168" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">customer_said</text>
<text x="427.0" y="198" font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">+ created_at: when it was written</text>
