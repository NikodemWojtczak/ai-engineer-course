<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="520" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">One tool call: who does what</text>
<rect x="30.0" y="48" width="160" height="44" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="110.0" y="62.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">get_balance</text>
<text x="110.0" y="79.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">your function</text>
<line x1="110" y1="92" x2="110" y2="470" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="285.0" y="48" width="170" height="44" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="370.0" y="62.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">your code</text>
<text x="370.0" y="79.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the client, the loop</text>
<line x1="370" y1="92" x2="370" y2="470" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="565.0" y="48" width="190" height="44" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="660.0" y="62.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the API · the model</text>
<text x="660.0" y="79.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">writes text, runs nothing</text>
<line x1="660" y1="92" x2="660" y2="470" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="350" cy="128" r="10" fill="#0b0b0b"/>
<text x="350" y="128.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">1</text>
<line x1="370" y1="128" x2="660" y2="128" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="515.0" y="119" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">request: the question and the tool schemas</text>
<text x="515.0" y="140" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">messages: [user: What is the balance of A-1001?]</text>
<text x="515.0" y="154" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">tools: [the get_balance schema]</text>
<circle cx="680" cy="198" r="10" fill="#0b0b0b"/>
<text x="680" y="198.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">2</text>
<line x1="660" y1="198" x2="370" y2="198" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="515.0" y="189" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">response: a tool call instead of text</text>
<text x="515.0" y="210" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">finish_reason "tool_calls" · content null</text>
<text x="515.0" y="224" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">tool_calls[0]: get_balance {"account_id":"A-1001"}</text>
<circle cx="390" cy="268" r="10" fill="#0b0b0b"/>
<text x="390" y="268.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">3</text>
<line x1="370" y1="268" x2="110" y2="268" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="240.0" y="259" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">your code runs it</text>
<text x="240.0" y="280" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">json.loads(arguments)</text>
<text x="240.0" y="294" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">get_balance("A-1001")</text>
<line x1="110" y1="330" x2="370" y2="330" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="240.0" y="321" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the result</text>
<text x="240.0" y="342" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">{"account_id": "A-1001",</text>
<text x="240.0" y="356" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace"> "balance_eur": 1240.5}</text>
<circle cx="350" cy="390" r="10" fill="#0b0b0b"/>
<text x="350" y="390.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">4</text>
<line x1="370" y1="390" x2="660" y2="390" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="515.0" y="381" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">request again, two messages longer</text>
<text x="515.0" y="402" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">+ assistant: the tool call (id call_D9qd…)</text>
<text x="515.0" y="416" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">+ tool: tool_call_id call_D9qd…, the result</text>
<line x1="660" y1="448" x2="370" y2="448" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="515.0" y="439" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">response: the answer in text</text>
<text x="515.0" y="460" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">finish_reason "stop" · content: the answer</text>
<text x="24" y="500" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Two requests, one tool run. The model writes the call (②) and the answer (after ④); only your code runs anything (③).</text>
</svg>
