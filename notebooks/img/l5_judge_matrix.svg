<svg xmlns="http://www.w3.org/2000/svg" width="780" height="284" viewBox="0 0 780 284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="284" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Is the judge right? Its verdicts against human labels</text>
<text x="380" y="50" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the judge says</text>
<text x="295.0" y="70" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">passed: true</text>
<text x="465.0" y="70" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">passed: false</text>
<text x="110" y="50" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the label</text>
<text x="110" y="117.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">GOOD answer</text>
<text x="110" y="187.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">BAD answer</text>
<rect x="210" y="84" width="166" height="66" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="293.0" y="109.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">true positive</text>
<text x="293.0" y="126.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">right: passes a good answer</text>
<rect x="380" y="84" width="166" height="66" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="463.0" y="109.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">false negative</text>
<text x="463.0" y="126.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">wrong: fails a good answer</text>
<rect x="210" y="154" width="166" height="66" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="293.0" y="179.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">false positive</text>
<text x="293.0" y="196.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">wrong: passes a bad answer</text>
<rect x="380" y="154" width="166" height="66" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="463.0" y="179.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">true negative</text>
<text x="463.0" y="196.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">right: fails a bad answer</text>
<rect x="570" y="84" width="186" height="117" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="580" y="98.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">TPR = TP / (TP + FN)</text>
<text x="580" y="113.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">of the good answers, the</text>
<text x="580" y="128.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">share the judge passes</text>
<text x="580" y="143.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve"></text>
<text x="580" y="158.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">TNR = TN / (TN + FP)</text>
<text x="580" y="173.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">of the bad answers, the</text>
<text x="580" y="188.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">share the judge fails</text>
<text x="24" y="248" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Accuracy alone hides the side of the mistake. A judge that passes everything has TPR 1.0 and TNR 0.0: on a set of</text>
<text x="24" y="264" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">mostly good answers it looks accurate and lets every bad answer through. Report both, with their n.</text>
</svg>
