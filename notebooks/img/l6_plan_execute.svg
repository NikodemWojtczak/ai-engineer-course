<svg xmlns="http://www.w3.org/2000/svg" width="780" height="216" viewBox="0 0 780 216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="216" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Plan-then-execute: approve the plan, not each step</text>
<rect x="24" y="56" width="150" height="56" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="99.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the request</text>
<text x="99.0" y="93.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the user's words only</text>
<line x1="174" y1="84" x2="204" y2="84" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="204" y="50" width="170" height="68" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="214" y="66" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the plan</text>
<text x="214" y="84" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">{"steps": ["list_emails",</text>
<text x="214" y="98" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">           "read_email"]}</text>
<line x1="374" y1="84" x2="404" y2="84" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="404" y="56" width="150" height="56" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="479.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">check_plan</text>
<text x="479.0" y="93.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">every step allowed?</text>
<line x1="554" y1="84" x2="584" y2="84" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="584" y="56" width="172" height="56" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="670.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">run exactly the plan</text>
<text x="670.0" y="93.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">no step added later</text>
<path d="M 670 112 L 670 146" fill="none" stroke="#d23c3c" stroke-width="1.3" marker-end="url(#arrow_red)"/>
<rect x="470" y="146" width="286" height="57" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="480" y="160.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">an instruction inside a tool result arrives</text>
<text x="480" y="175.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">here, after the plan is fixed: it cannot</text>
<text x="480" y="190.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">add a step (it can still change the data)</text>
<rect x="24" y="146" width="420" height="57" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="34" y="160.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">A plan with a step outside the allowed set is rejected</text>
<text x="34" y="175.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">whole, before the first tool runs.</text>
<text x="34" y="190.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Code checks the shape of the work up front.</text>
</svg>
