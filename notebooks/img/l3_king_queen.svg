<text x="24" y="384" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">A sketch: the model gives 256 numbers per word here. Example 3.2 draws the map of the real vectors.</text>
