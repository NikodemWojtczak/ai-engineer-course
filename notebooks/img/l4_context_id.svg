<svg xmlns="http://www.w3.org/2000/svg" width="780" height="484" viewBox="0 0 780 484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="484" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">A conversation: the contextId</text>
<rect x="25.0" y="44" width="190" height="44" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="120.0" y="58.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">our client</text>
<text x="120.0" y="75.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">keeps only the contextId</text>
<line x1="120" y1="88" x2="120" y2="440" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="335.0" y="44" width="210" height="44" rx="6" fill="#ece6f8" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="440.0" y="58.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">lending server, port 5145</text>
<text x="440.0" y="75.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">keeps the histories</text>
<line x1="440" y1="88" x2="440" y2="440" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="196.0" cy="99" r="10" fill="#0b0b0b"/>
<text x="196.0" y="99.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">1</text>
<line x1="120" y1="108" x2="440" y2="108" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="280.0" y="99" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">turn 1, no contextId</text>
<text x="280.0" y="120" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"… a car loan of 20,000 EUR."</text>
<line x1="440" y1="160" x2="120" y2="160" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="280.0" y="151" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the reply, contextId A</text>
<text x="280.0" y="172" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the server opened conversation A</text>
<circle cx="199.3" cy="221" r="10" fill="#0b0b0b"/>
<text x="199.3" y="221.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">2</text>
<line x1="120" y1="230" x2="440" y2="230" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="280.0" y="221" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">turn 2, contextId A</text>
<text x="280.0" y="242" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"Which amount did I mention?"</text>
<line x1="440" y1="282" x2="120" y2="282" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="280.0" y="273" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the reply, contextId A</text>
<text x="280.0" y="294" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the answer names 20,000 EUR</text>
<circle cx="172.9" cy="343" r="10" fill="#0b0b0b"/>
<text x="172.9" y="343.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">3</text>
<line x1="120" y1="352" x2="440" y2="352" stroke="#d23c3c" stroke-width="1.4" marker-end="url(#arrow_red)"/>
<text x="280.0" y="343" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the same words, contextId B</text>
<text x="280.0" y="364" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">"Which amount did I mention?"</text>
<line x1="440" y1="404" x2="120" y2="404" stroke="#d23c3c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow_red)"/>
<text x="280.0" y="395" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the reply, contextId B</text>
<text x="280.0" y="416" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the answer knows no amount</text>
<rect x="576" y="92" width="180" height="164" rx="6" fill="#ffffff" stroke="#7b5cc4" stroke-width="1.2"/>
<text x="588" y="110" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">conversation A</text>
<text x="588" y="134" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">system: the lending prompt</text>
<text x="588" y="151" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">user: … 20,000 EUR.</text>
<text x="588" y="168" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">assistant: a tool call</text>
<text x="588" y="185" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">tool: …</text>
<text x="588" y="202" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">assistant: …</text>
<text x="588" y="219" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">user: Which amount …?</text>
<text x="588" y="236" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">assistant: … 20,000 EUR …</text>
<rect x="576" y="336" width="180" height="58" rx="6" fill="#ffffff" stroke="#d23c3c" stroke-width="1.2"/>
<text x="588" y="352" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">conversation B</text>
<text x="588" y="370" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">system, user: Which …?</text>
<text x="588" y="385" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">assistant: …</text>
<text x="24" y="464" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Each turn sends only the new message; the history stays on the server, under the id. The id the client sends decides the conversation.</text>
</svg>
