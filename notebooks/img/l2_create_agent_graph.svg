<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="380" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">The graph create_agent builds: model, tools and the loop between them</text>
<rect x="280" y="48" width="100" height="30" rx="15" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="330" y="63.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">start</text>
<rect x="420" y="286" width="100" height="30" rx="15" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="470" y="301.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">end</text>
<rect x="260" y="130" width="140" height="44" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="330.0" y="144.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">model</text>
<text x="330.0" y="161.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">calls the LLM</text>
<rect x="540" y="130" width="140" height="44" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="610.0" y="144.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">tools</text>
<text x="610.0" y="161.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">runs the tool calls</text>
<line x1="330" y1="78" x2="330" y2="128" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="338" y="103" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">always, first</text>
<line x1="400" y1="142" x2="538" y2="142" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="470" y="134" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">tool calls</text>
<line x1="540" y1="162" x2="402" y2="162" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="470" y="176" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the results</text>
<path d="M 260 140 C 196 116, 196 180, 258 164" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="194" y="140" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle" xml:space="preserve">not a valid answer:</text>
<text x="194" y="154" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the model tries again</text>
<line x1="350" y1="174" x2="446" y2="284" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="390" y="236" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle" xml:space="preserve">no tool calls:</text>
<text x="390" y="250" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the model answered</text>
<line x1="590" y1="174" x2="494" y2="284" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="552" y="236" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">SupportReply was called:</text>
<text x="552" y="250" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the structured answer</text>
<line x1="24" y1="336" x2="64" y2="336" stroke="#52514e" stroke-width="1.4"/>
<text x="72" y="336" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">always taken</text>
<line x1="184" y1="336" x2="224" y2="336" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="232" y="336" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a choice the graph makes after the node ran</text>
<text x="24" y="362" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">tools → model is the loop of Part 2. Drawn from agent_b.get_graph() of Example 5.3: the nodes __start__, model, tools, __end__.</text>
</svg>
