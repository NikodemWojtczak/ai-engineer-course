<rect x="210" y="76" width="78.79" height="20" rx="10" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="249.395" y="86.5" font-size="9.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">bank_record</text>
<rect x="24" y="104" width="180" height="24" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="32" y="116" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Moved to Lisbon</text>
<rect x="210" y="106" width="90.57" height="20" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="255.285" y="116.5" font-size="9.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve" font-family="Menlo, Consolas, monospace">customer_said</text>
