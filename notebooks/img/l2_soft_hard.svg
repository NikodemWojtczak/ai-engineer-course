<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d23c3c"/></marker></defs>
<rect width="780" height="380" fill="#fcfcfb"/>
<text x="24" y="22" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Soft and hard control of an action that cannot be undone</text>
<rect x="24" y="42" width="360" height="300" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<rect x="396" y="42" width="360" height="300" rx="6" fill="#efeeea" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="40" y="62" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Soft control: a rule written for the model</text>
<text x="412" y="62" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" dominant-baseline="middle" xml:space="preserve">Hard control: a check in your code</text>
<rect x="64" y="84" width="280" height="44" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="204.0" y="98.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the model</text>
<text x="204.0" y="115.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">reads: "call with confirm=true only after a yes"</text>
<line x1="204" y1="128" x2="204" y2="158" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="64" y="160" width="280" height="44" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="204.0" y="174.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">refund_with_confirm(…, confirm=true)</text>
<text x="204.0" y="191.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">the model decides when to send true</text>
<line x1="204" y1="204" x2="204" y2="234" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="64" y="236" width="280" height="40" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="204.0" y="256.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">money is paid</text>
<text x="204" y="300" font-size="11" fill="#d23c3c" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Nothing checks that the customer said yes.</text>
<text x="204" y="318" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Works while the model follows the text.</text>
<rect x="436" y="84" width="280" height="44" rx="6" fill="#fde9e2" stroke="#eb6834" stroke-width="1.2"/>
<text x="576.0" y="98.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">the model</text>
<text x="576.0" y="115.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">asks for refund(T-302, 61.20)</text>
<line x1="576" y1="128" x2="576" y2="158" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="436" y="160" width="280" height="44" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="576.0" y="174.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">your loop: a gate before refund</text>
<text x="576.0" y="191.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">a person approves the arguments?</text>
<line x1="520" y1="204" x2="480" y2="236" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="632" y1="204" x2="672" y2="236" stroke="#52514e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="412" y="238" width="150" height="40" rx="6" fill="#dff5ec" stroke="#1baf7a" stroke-width="1.2"/>
<text x="487.0" y="258.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">yes: refund runs</text>
<rect x="590" y="238" width="150" height="40" rx="6" fill="#fbe3e3" stroke="#d23c3c" stroke-width="1.2"/>
<text x="665.0" y="250.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" dominant-baseline="middle" xml:space="preserve">no: a tool message</text>
<text x="665.0" y="267.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">"refused by a person"</text>
<text x="576" y="318" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" dominant-baseline="middle" xml:space="preserve">The model cannot skip it: the code runs every call.</text>
<text x="24" y="362" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle" xml:space="preserve">Part 4 builds the soft control; Level 6 builds the hard one.</text>
</svg>
